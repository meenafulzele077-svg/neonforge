name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Inspect Shizuku API surface (diagnostic)
        continue-on-error: true
        run: |
          mkdir -p /tmp/shizuku_api
          curl -fsSL -o /tmp/shizuku_api/api.aar https://repo1.maven.org/maven2/dev/rikka/shizuku/api/13.1.5/api-13.1.5.aar || echo "CURL_FAILED"
          cd /tmp/shizuku_api
          unzip -o -q api.aar classes.jar || echo "UNZIP_FAILED"
          echo "=== public surface: rikka.shizuku.Shizuku ==="
          javap -classpath classes.jar rikka.shizuku.Shizuku || echo "JAVAP_FAILED"
          echo "=== public surface: rikka.shizuku.ShizukuRemoteProcess ==="
          javap -classpath classes.jar rikka.shizuku.ShizukuRemoteProcess || true
          echo "=== IShizukuService process/shell methods ==="
          javap -classpath classes.jar rikka.shizuku.IShizukuService | grep -iE "process|shell" || true

      - name: Run unit tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK artifact is non-empty
        run: |
          ls -l app/build/outputs/apk/debug/
          test -s app/build/outputs/apk/debug/app-debug.apk
          echo "APK_VERIFIED_NON_EMPTY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: neonforge-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
