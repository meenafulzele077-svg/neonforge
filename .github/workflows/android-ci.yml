name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Resolve dependencies for API inspection
        continue-on-error: true
        run: gradle --no-daemon -q app:dependencies --configuration debugCompileClasspath > /dev/null 2>&1 || true

      - name: Inspect Shizuku API surface (diagnostic)
        continue-on-error: true
        run: |
          echo "=== shizuku artifacts in cache ==="
          find "$HOME/.gradle/caches/modules-2/files-2.1" -path "*shizuku*" -type f | head -n 20
          AAR=$(find "$HOME/.gradle/caches/modules-2/files-2.1" -path "*shizuku*" -name "api-*.aar" | head -n 1)
          echo "AAR=$AAR"
          if [ -n "$AAR" ]; then
            mkdir -p /tmp/shizuku_api
            unzip -o -q "$AAR" classes.jar -d /tmp/shizuku_api
            echo "=== public surface: rikka.shizuku.Shizuku (filtered) ==="
            javap -classpath /tmp/shizuku_api/classes.jar rikka.shizuku.Shizuku | grep -iE "process|service|ping|permission|version|uid|class|interface" || true
            echo "=== public surface: rikka.shizuku.ShizukuRemoteProcess ==="
            javap -classpath /tmp/shizuku_api/classes.jar rikka.shizuku.ShizukuRemoteProcess || true
            echo "=== IShizukuService process-related methods ==="
            javap -classpath /tmp/shizuku_api/classes.jar rikka.shizuku.IShizukuService | grep -iE "process|shell" || true
          fi

      - name: Run unit tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK artifact is non-empty
        run: |
          ls -l app/build/outputs/apk/debug/
          test -s app/build/outputs/apk/debug/app-debug.apk
          echo "APK_VERIFIED_NON_EMPTY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: neonforge-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
