name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Inspect Shizuku API surface (diagnostic)
        continue-on-error: true
        run: |
          {
            mkdir -p /tmp/shizuku_api/v12
            echo "=== 13.1.5: newProcess visibility ==="
            curl -fsSL -o /tmp/shizuku_api/api.aar https://repo1.maven.org/maven2/dev/rikka/shizuku/api/13.1.5/api-13.1.5.aar || echo "CURL_FAILED_13"
            unzip -o -q /tmp/shizuku_api/api.aar classes.jar -d /tmp/shizuku_api
            javap -classpath /tmp/shizuku_api/classes.jar rikka.shizuku.Shizuku | grep -iE "newProcess" || echo "13.1.5: NO PUBLIC OR PRIVATE newProcess MATCH"
            echo "=== 12.2.0: newProcess visibility ==="
            curl -fsSL -o /tmp/shizuku_api/api12.aar https://repo1.maven.org/maven2/dev/rikka/shizuku/api/12.2.0/api-12.2.0.aar || echo "CURL_FAILED_12"
            unzip -o -q /tmp/shizuku_api/api12.aar classes.jar -d /tmp/shizuku_api/v12
            javap -p -classpath /tmp/shizuku_api/v12/classes.jar rikka.shizuku.Shizuku | grep -iE "newProcess" || echo "12.2.0: NO newProcess MATCH"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run unit tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Print Shizuku entries from merged manifest
        run: |
          M=$(find app/build/intermediates -path "*merged_manifest*" -name "AndroidManifest.xml" | head -n 1)
          echo "MERGED_MANIFEST=$M"
          grep -i -n "shizuku" "$M" || echo "NO_SHIZUKU_ENTRIES_IN_MERGED_MANIFEST"

      - name: Verify APK artifact is non-empty
        run: |
          ls -l app/build/outputs/apk/debug/
          test -s app/build/outputs/apk/debug/app-debug.apk
          echo "APK_VERIFIED_NON_EMPTY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: neonforge-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
